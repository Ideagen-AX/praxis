<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- GENERATED redirect stub. GitHub Pages serves static files only, so there is
     no server-side redirect available: this is the client-side equivalent, and it
     uses all three mechanisms because each covers a case the others do not.

     meta refresh   works with JavaScript disabled
     location.replace  fires sooner, and does NOT add a history entry, so Back
                       goes where the reader came from rather than bouncing here
     the visible link  the fallback if both are blocked

     noindex keeps the stub out of search results while the canonical tag hands
     any accumulated ranking to the real page. -->
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url={{target}}">
<link rel="canonical" href="{{target}}">
<title>Moved to {{title}} · Praxis</title>
<link rel="stylesheet" href="{{root}}praxis/praxis.css">
<link rel="stylesheet" href="{{root}}assets/site.css">
</head>
<body data-variant="praxis" data-theme="light">
<main class="doc-stub">
  <div class="admin-card">
    <h1 class="admin-card__title">This page moved</h1>
    <p><code>{{from}}</code> is now <a href="{{target}}">{{title}}</a>.</p>
    <p class="admin-note">Taking you there now. If nothing happens, use the link above.</p>
  </div>
</main>
<script>location.replace({{targetjson}});</script>
</body>
</html>
