# Publish to npm on a version tag.
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ DO NOT RENAME THIS FILE without updating npm.                           │
# │                                                                          │
# │ npm's trusted publisher is bound to this file's NAME — "publish.yml".    │
# │ It validates GitHub's job_workflow_ref OIDC claim, which resolves to     │
# │   Ideagen-AX/praxis/.github/workflows/publish.yml@refs/tags/vX.Y.Z       │
# │ Rename the file and every publish fails an OIDC check that reads like a  │
# │ credentials problem. Update the trusted publisher on npmjs.com first.    │
# └─────────────────────────────────────────────────────────────────────────┘
#
# One-time setup on npmjs.com — Settings for @ideagen-ax/praxis → Publishing
# access → add a trusted publisher:
#     Provider          GitHub Actions
#     Organization      Ideagen-AX
#     Repository        praxis
#     Workflow filename publish.yml
#     Environment       (leave blank — see the note at the bottom)
#
# There is no token and no secret. Authentication is a short-lived OIDC
# credential minted per run, which is also why this works at all: the npm
# account uses a passkey, so an interactive publish has no OTP to pass and a
# non-TTY publish dies with EOTP. Trusted publishing sidesteps 2FA entirely.
#
# To release:
#     1. bump "version" in package.json
#     2. write the CHANGELOG entry
#     3. commit, then:  git tag v0.1.3 && git push origin v0.1.3
#
# The tag is the trigger. Pushing to main does NOT publish — npm refuses to
# republish an existing version, so a push-triggered workflow would fail on
# every commit that doesn't bump the version, and a job that's usually red is a
# job nobody reads.

name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required: this is what mints the OIDC token

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1. The npm bundled with any Node
      # release is older than that, so upgrade rather than hope.
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          npm --version

      # build-package.py is stdlib-only (json, re, shutil, sys, pathlib) — there
      # is nothing to pip install. Pinned anyway so a runner image change to the
      # default python3 can't move the build underneath a release.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # A mismatched tag is the one failure mode that silently ships the wrong
      # thing: v0.1.3 on a tree whose package.json still reads 0.1.2 would
      # publish 0.1.2 again (or fail confusingly). Fail loudly, first.
      - name: Verify the tag matches package.json
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p 'require("./package.json").version')"
          echo "tag: $tag_version   package.json: $pkg_version"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg_version}. Fix one and re-tag."
            exit 1
          fi

      # dist/ is gitignored, so it does not exist in a fresh clone — this is the
      # step that creates it. build-package.py verifies its own output and exits
      # non-zero on: a legacy --ehsq-* token, a font binary in the package, a
      # relative path that would 404 from a CDN, an unresolvable var() in the
      # barrel, or a barrel smaller than the sum of its parts.
      #
      # prepublishOnly runs this again during `npm publish`. That is deliberate
      # belt-and-braces: running it here means a build failure is reported as a
      # build failure, not as a publish failure.
      - name: Build and verify dist/
        run: npm run build

      # No --provenance flag needed: with trusted publishing npm attaches a
      # provenance attestation automatically. publishConfig.access is already
      # "public" in package.json, so no --access either.
      - name: Publish
        run: npm publish

      - name: Summary
        run: |
          version="$(node -p 'require("./package.json").version')"
          {
            echo "### Published \`@ideagen-ax/praxis@${version}\`"
            echo ""
            echo "- <https://www.npmjs.com/package/@ideagen-ax/praxis/v/${version}>"
            echo ""
            echo "The registry's read side can lag a successful write by several"
            echo "minutes, so a 404 immediately after this does not mean it failed."
          } >> "$GITHUB_STEP_SUMMARY"

# Optional hardening, if you want a human in the loop on releases:
#   1. Create a GitHub environment (Settings → Environments), e.g. "npm", with
#      required reviewers.
#   2. Add `environment: npm` to the job above.
#   3. Set the same name in the Environment field of the npm trusted publisher.
# All three must agree — npm rejects the publish if the job's environment does
# not match what the trusted publisher expects.
